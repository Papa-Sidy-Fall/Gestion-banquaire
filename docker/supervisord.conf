[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor/

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

[program:php-fpm]
command=/usr/local/sbin/php-fpm
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/php-fpm.out.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-jobs=1000 --timeout=90
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/queue-worker.out.log
stderr_logfile=/var/log/supervisor/queue-worker.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

[program:scheduler]
command=php /var/www/html/artisan schedule:run
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/scheduler.out.log
stderr_logfile=/var/log/supervisor/scheduler.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB