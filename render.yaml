services:
  - type: pserv
    name: postgres
    runtime: docker
    dockerfilePath: ./docker/postgres.Dockerfile
    envVars:
      - key: POSTGRES_DB
        value: laravel
      - key: POSTGRES_USER
        value: laravel
      - key: POSTGRES_PASSWORD
        generateValue: true
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  - type: web
    name: laravel-api
    runtime: docker
    buildCommand: "docker build -t laravel-api ."
    startCommand: "docker run -p $PORT:80 laravel-api"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: postgres
          property: connectionString
    dependsOn:
      - postgres

# Environment groups for different stages
environments:
  - name: production
    source:
      type: git
      repo: https://github.com/Papa-Sidy-Fall/Gestion-banquaire.git
      branch: dev/v1.0.0